# Publish a GitHub Release with the Windows installer.
#
#   git tag v0.2.0 && git push --tags
#
# Every step is safe to re-run: an existing release is updated, not duplicated.
#
#   tag v*       : verify the tag matches package.json, run CI, build, publish
#   manual run   : same, but nothing is published unless "publish" is ticked

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to check against (e.g. v0.2.0)'
        required: true
      publish:
        description: 'Really publish (otherwise build only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: verify version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi
          grep -q "^## \[$VERSION\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  release:
    name: build and publish
    needs: [verify, ci]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum Writer-*-Windows-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          FILES="dist/Writer-*-Windows-*.exe dist/SHA256SUMS.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --title "Writer $TAG" --generate-notes --verify-tag
          fi
