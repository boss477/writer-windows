name: Bug report
description: Something in Writer is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For **security problems**, do not file a public issue; see
        [SECURITY.md](https://github.com/boss477/writer-windows/blob/master/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a workspace
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Writer version
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: 'Windows 11 23H2'
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or a sample note
      description: Drag files in here. Remove anything private first.
